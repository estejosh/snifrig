[package]
name = "snifrig-fix"
version = "0.4.0-beta.2"
edition = "2021"
license = "LicenseRef-UFL-3.7-U.P-snifrig-fix"
description = "Snifrig fixer: acts on what the snifrig monitor finds. Licensed separately from the monitor."

[lib]
path = "src/lib.rs"

[[bin]]
name = "snifrig-fix"
path = "src/main.rs"

[[bin]]
name = "snifrig-frames"
path = "src/bin/snifrig-frames.rs"

[[bin]]
name = "snifrig-keygen"
path = "src/bin/snifrig-keygen.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_Services",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Etw",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3"

[dependencies]
ed25519-compact = { version = "2", default-features = false, features = ["random"] }
