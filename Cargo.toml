[package]
name = "snifrig"
version = "0.4.0-beta.2"
edition = "2021"
description = "Low-footprint Windows leak monitor: kernel pool tags, handles, commit, spawn churn. One process, no children."
license = "LicenseRef-UFL-3.7-U.P-snifrig-fix"

[dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_ProcessStatus", "Win32_Storage_FileSystem",
  "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_Networking_WinHttp", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Ioctl", "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Time",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["fixer", "app", "mcp"]
