name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: snifrig-windows
          path: |
            target/release/snifrig.exe
            target/release/snifrigd.exe
            target/release/snifrig-tray.exe
