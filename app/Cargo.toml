[package]
name = "snifrig-app"
version = "0.4.0-beta.2"
edition = "2021"
description = "The snifrig window: what slows your PC down, and every fixer setting, without text files."
license = "LicenseRef-UFL-3.7"

[[bin]]
name = "snifrig-app"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
eframe = "0.32"
qrcode = { version = "0.14", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_System_Time", "Win32_UI_WindowsAndMessaging",
] }
